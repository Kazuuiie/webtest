<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     BỐ CỤC: màn hình nền có icon | cửa sổ kéo thả | thanh tác vụ + menu Start | widget nhạc bên phải
     ============================================================ */
  :root {
    --bg: #070a1a;
    --text: #e8ecff;
    --muted: #9aa3cf;
    --accent: #8fa6ff;
    --card: rgba(14, 18, 44, 0.55);
    --line: rgba(160, 175, 255, 0.18);
    --hover: rgba(160, 175, 255, 0.08);
    --active: rgba(160, 175, 255, 0.14);
    --glass: rgba(12, 16, 40, 0.72);
    --glass-strong: rgba(10, 13, 34, 0.9);
    --font: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Nền (để trống ảnh thì dùng nền sao mặc định) ---------- */
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 28% 62%, #cfd8ff, transparent),
      radial-gradient(1.4px 1.4px at 44% 12%, #fff, transparent),
      radial-gradient(1px 1px at 63% 38%, #bcc8ff, transparent),
      radial-gradient(1.2px 1.2px at 78% 74%, #fff, transparent),
      radial-gradient(1px 1px at 90% 20%, #cfd8ff, transparent),
      radial-gradient(1px 1px at 55% 85%, #fff, transparent),
      radial-gradient(ellipse at 80% 20%, #1b2a6b 0%, transparent 55%),
      radial-gradient(ellipse at 20% 100%, #0f1a4a 0%, transparent 60%),
      #070a1a;
    background-size: cover;
    background-position: center;
  }
  .bg-overlay { position: fixed; inset: 0; z-index: -1; background: #04061a; opacity: 0; }

  .icon { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .icon.solid { fill: currentColor; stroke: none; }

  /* ---------- Hệ điều hành: màn hình nền, cửa sổ, thanh tác vụ ---------- */
  html, body { height: 100%; overflow: hidden; }
  .os { position: fixed; inset: 0; z-index: 1; isolation: isolate; display: flex; flex-direction: column; }
  .desktop { position: relative; flex: 1; min-height: 0; overflow: hidden; }

  /* icon trên màn hình nền */
  .icons { position: absolute; left: 14px; top: 14px; bottom: 14px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 6px 4px; }
  .dicon {
    width: 90px; display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 10px 4px 8px; border-radius: 10px; border: 1px solid transparent; background: none;
    color: var(--text); font-size: .78rem; text-align: center; cursor: pointer;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .85); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .dicon:hover { background: rgba(160, 175, 255, .12); }
  .dicon.sel { background: rgba(160, 175, 255, .22); border-color: rgba(160, 175, 255, .4); }
  .tile {
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none;
    background: linear-gradient(145deg, rgba(143, 166, 255, .38), rgba(60, 80, 200, .28));
    border: 1px solid var(--line); box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
  }
  .tile .icon { width: 26px; height: 26px; }

  /* widget nhạc nằm trên màn hình nền */
  .widgets { position: absolute; top: 14px; right: 14px; width: 350px; max-height: calc(100% - 28px); overflow-y: auto; z-index: 5; scrollbar-width: none; }
  .widgets::-webkit-scrollbar { display: none; }

  /* cửa sổ */
  .win {
    position: absolute; display: flex; flex-direction: column; min-width: 300px; min-height: 200px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
    transition: opacity .18s, transform .18s, box-shadow .2s;
  }
  .win.focused { box-shadow: 0 26px 70px rgba(0, 0, 0, .6); border-color: rgba(160, 175, 255, .32); }
  .win:not(.focused) .win-bar { opacity: .7; }
  .win.pop { animation: pop .22s ease; }
  .win.min { opacity: 0; transform: translateY(40px) scale(.92); pointer-events: none; visibility: hidden; transition: opacity .18s, transform .18s, visibility 0s .18s; }
  .win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; border: 0; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

  .win-bar { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 6px 0 14px; flex: none; cursor: grab; user-select: none; touch-action: none; background: rgba(160, 175, 255, .05); border-bottom: 1px solid var(--line); transition: opacity .2s; }
  .win-bar.drag { cursor: grabbing; }
  .win-bar > .icon { width: 16px; height: 16px; color: var(--accent); }
  .win-title { flex: 1; min-width: 0; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-btns { display: flex; gap: 2px; }
  .win-btns button { width: 40px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
  .win-btns button:hover { background: var(--hover); color: var(--text); }
  .win-btns button.x:hover { background: #e5484d; color: #fff; }
  .win-btns .icon { width: 14px; height: 14px; }
  .win-body { flex: 1; min-height: 0; overflow: auto; padding: 22px 24px; scrollbar-width: thin; scrollbar-color: rgba(160, 175, 255, .3) transparent; }
  .win-rs { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 55%, rgba(160, 175, 255, .5) 55%, rgba(160, 175, 255, .5) 62%, transparent 62%, transparent 76%, rgba(160, 175, 255, .5) 76%, rgba(160, 175, 255, .5) 83%, transparent 83%); }
  .win.max .win-rs { display: none; }

  .about { display: flex; flex-direction: column; gap: 26px; }
  .sec { margin-bottom: 26px; }
  .sec:last-child { margin-bottom: 0; }
  .sec h2 { display: flex; align-items: center; gap: 10px; font-weight: 400; font-size: 1rem; margin-bottom: 14px; }
  .win .mv-head h2 { font-size: 1.3rem; }
  .win .mv-head { margin-bottom: 14px; }
  .win .plist { padding: 0; }

  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .gal figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .gal img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #121842; display: block; }
  .gal figcaption { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links { display: flex; flex-direction: column; gap: 8px; }
  .link-row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(160, 175, 255, .05); color: var(--text); text-decoration: none; transition: background .2s; }
  .link-row:hover { background: var(--hover); }
  .link-row .tile { width: 42px; height: 42px; border-radius: 12px; }
  .link-row .tile .icon { width: 22px; height: 22px; }
  .link-row > .icon { margin-left: auto; color: var(--muted); }
  .lr-text { min-width: 0; display: flex; flex-direction: column; }
  .lr-text b { font-weight: 400; }
  .lr-text small { color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* thanh tác vụ */
  .taskbar {
    flex: none; height: 60px; position: relative; z-index: 3000; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px;
    background: rgba(8, 11, 30, .74); border-top: 1px solid var(--line);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  }
  .tb-left { min-width: 0; display: flex; }
  .tb-song { display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 6px 12px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: .8rem; cursor: pointer; }
  .tb-song:hover { background: var(--hover); color: var(--text); }
  .tb-song .eq { display: flex; flex: none; }
  .tb-song span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .is-playing .tb-song .eq i { animation-play-state: running; }
  .tb-center { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .tb-apps { display: flex; gap: 4px; }
  .tb-btn { position: relative; width: 44px; height: 44px; flex: none; border: 0; border-radius: 10px; background: none; color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .15s; }
  .tb-btn:hover { background: var(--hover); }
  .tb-btn:active { transform: scale(.94); }
  .tb-btn .icon { width: 23px; height: 23px; }
  .tb-btn.tb-start { color: var(--accent); margin-right: 6px; }
  .tb-btn.tb-start[aria-expanded="true"] { background: var(--active); }
  .tb-btn.open::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 6px; height: 3px; margin-left: -3px; border-radius: 3px; background: var(--muted); transition: width .2s, margin .2s, background .2s; }
  .tb-btn.active { background: var(--active); }
  .tb-btn.active::after { width: 16px; margin-left: -8px; background: var(--accent); }
  .tb-right { justify-self: end; display: flex; align-items: center; gap: 4px; }
  .clock { text-align: right; padding: 4px 10px; font-size: .75rem; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums; }
  .clock b { display: block; color: var(--text); font-weight: 500; font-size: .85rem; }

  /* menu Start */
  .start {
    position: absolute; left: 0; right: 0; bottom: 68px; margin: 0 auto; width: min(440px, calc(100% - 24px)); z-index: 3100;
    padding: 20px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--line);
    backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    animation: pop .18s ease;
  }
  .start-head { display: flex; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .start-head img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(143, 166, 255, .55); background: #121842; }
  .start-head b { display: block; font-weight: 400; font-size: 1.05rem; }
  .start-head small { color: var(--muted); font-size: .8rem; }
  .start-apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px 0; }
  .start-app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border: 0; border-radius: 12px; background: none; font-size: .8rem; cursor: pointer; transition: background .15s; }
  .start-app:hover { background: var(--hover); }
  .start-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
  .start-foot .btn { padding: 7px 14px; }

  /* ---------- Hồ sơ (cửa sổ About Me) ---------- */
  .profile { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .avatar-ring {
    width: 128px; height: 128px; border-radius: 50%;
    padding: 6px; border: 2px solid rgba(143,166,255,.55);
    box-shadow: 0 0 30px rgba(110,140,255,.35);
    flex: none;
  }
  .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #121842; }
  .who { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .who h1 { font-weight: 400; font-size: 2.2rem; letter-spacing: .02em; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; overflow-wrap: anywhere; }
  .who h1 .icon { color: var(--accent); width: .6em; height: .6em; }
  .who p { color: var(--muted); font-size: .95rem; }
  .socials { display: flex; gap: 22px; margin-top: 6px; }
  .socials a { color: var(--text); display: grid; place-items: center; opacity: .9; transition: color .2s, transform .2s; }
  .socials a:hover { color: var(--accent); transform: translateY(-2px); }
  .socials .icon { width: 28px; height: 28px; }

  .info { display: flex; flex-wrap: wrap; gap: 0; }
  .info-item { display: flex; gap: 12px; align-items: flex-start; padding: 0 28px; border-left: 1px solid var(--line); }
  .info-item:first-child { padding-left: 0; border-left: 0; }
  .info-item .icon { color: var(--muted); margin-top: 2px; }
  .info-item small { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 4px; }
  .info-item span { font-size: .8rem; }

  .quote { max-width: 300px; color: var(--muted); font-style: italic; font-size: .95rem; line-height: 1.7; }
  .quote cite { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: .75rem; font-style: normal; }
  .quote cite i { display: block; width: 56px; height: 1px; background: var(--line); }

  /* ---------- Cột phải ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 22px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .card h2 { display: flex; align-items: center; gap: 12px; font-weight: 400; font-size: 1rem; margin-bottom: 18px; }
  .card h2 .icon { color: var(--text); }

  /* ---------- Thanh trượt dùng chung (tiến trình + âm lượng) ---------- */
  .range {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px; background: transparent; cursor: pointer; --p: 0%;
  }
  .range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p), rgba(160,175,255,.25) var(--p)); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(143,166,255,.8); }
  .range::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(160,175,255,.25); }
  .range::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
  .range::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(143,166,255,.8); }

  /* ---------- Music box ---------- */
  .player { display: flex; flex-direction: column; gap: 14px; }
  .now { display: flex; gap: 14px; align-items: flex-start; }
  .cover { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #121842; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .now-text { flex: 1; min-width: 0; padding-top: 2px; }
  .now-text small { color: var(--muted); font-size: .72rem; }
  .now-text strong { display: block; font-weight: 400; font-size: 1.15rem; margin: 2px 0; overflow-wrap: anywhere; }
  .now-text span { font-size: .8rem; color: var(--muted); }
  .heart { color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px; transition: color .2s, transform .2s; }
  .heart:hover { color: var(--accent); }
  .heart.on { color: var(--accent); }
  .heart.on .icon { fill: currentColor; }

  .seek-wrap { display: flex; flex-direction: column; gap: 2px; }
  .times { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
  .ctrl { position: relative; background: none; border: 0; color: var(--accent); cursor: pointer; display: grid; place-items: center; padding: 4px; transition: color .2s, transform .15s; }
  .ctrl:hover { transform: scale(1.08); }
  .ctrl .icon { width: 22px; height: 22px; }
  .ctrl.sm { color: var(--muted); }
  .ctrl.sm .icon { width: 18px; height: 18px; }
  .ctrl.sm.on { color: var(--accent); }
  .ctrl.sm[data-mode="one"]::after {
    content: "1"; position: absolute; right: -2px; top: -2px;
    font-size: .6rem; line-height: 1; font-weight: 600; color: var(--accent);
  }
  .ctrl.play {
    width: 50px; height: 50px; border-radius: 50%; padding: 0;
    background: rgba(143,166,255,.18); border: 1px solid rgba(143,166,255,.5);
    box-shadow: 0 0 18px rgba(110,140,255,.3);
  }
  .ctrl.play .icon { width: 24px; height: 24px; }

  /* Nút âm lượng: thanh trượt nhỏ nổi lên khi di chuột / bấm vào */
  .vol { position: relative; display: grid; place-items: center; }
  .vol:hover > .ctrl, .vol.open > .ctrl { color: var(--accent); }
  .vol-pop {
    position: absolute; right: -10px; bottom: calc(100% + 8px);
    display: flex; align-items: center; gap: 8px; width: 150px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(12, 16, 40, .94); border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity .18s, transform .18s, visibility .18s;
  }
  .vol-pop::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; }
  .vol:hover .vol-pop, .vol:has(:focus-visible) .vol-pop, .vol.open .vol-pop { opacity: 1; visibility: visible; transform: none; }
  .vol-pop .range { flex: 1; min-width: 0; height: 14px; }
  .vol-num { width: 1.9em; text-align: right; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .mini-head { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); font-size: .85rem; }
  .mini-head span { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .link-btn { background: none; border: 0; cursor: pointer; color: var(--accent); font-size: .78rem; padding: 2px 4px; border-radius: 6px; }
  .link-btn:hover { text-decoration: underline; }
  .mini-actions { display: flex; align-items: center; gap: 6px; }
  .dots { background: none; border: 0; cursor: pointer; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; transition: background .2s, color .2s; }
  .dots:hover { background: var(--hover); color: var(--text); }
  .dots[aria-expanded="true"] { color: var(--accent); }
  .dots .icon { width: 20px; height: 20px; }
  .mini-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .25s ease; margin-top: -4px; }
  .mini-wrap.closed { grid-template-rows: 0fr; }
  .mini-wrap.closed .mini-list { visibility: hidden; }

  .mini-list { position: relative; min-height: 0; display: flex; flex-direction: column; gap: 2px; max-height: 172px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; scrollbar-width: thin; scrollbar-color: rgba(160,175,255,.3) transparent; }
  .mini-list::-webkit-scrollbar { width: 6px; }
  .mini-list::-webkit-scrollbar-thumb { background: rgba(160,175,255,.3); border-radius: 6px; }

  /* Hàng bài hát (dùng cho cả mini list và danh sách đầy đủ) */
  .trk, .row {
    display: grid; align-items: center; width: 100%;
    border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer;
    transition: background .2s;
  }
  .trk:hover, .row:hover { background: var(--hover); }
  .trk.active, .row.active { background: var(--active); }
  .trk { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; padding: 6px 8px; }
  .row { grid-template-columns: 34px 48px minmax(0, 1fr) auto; gap: 14px; padding: 10px 14px; }
  .tc { width: 38px; height: 38px; border-radius: 7px; object-fit: cover; background: #121842; }
  .row .tc { width: 48px; height: 48px; border-radius: 8px; }
  .tt { min-width: 0; }
  .tt b { display: block; font-weight: 400; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tt small { display: block; color: var(--muted); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tt b { font-size: 1rem; }
  .row .tt small { font-size: .8rem; }
  .dur { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
  .ix { display: grid; place-items: center; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .ix b { font-weight: 400; }

  /* Equalizer: hiện ở bài đang chọn, chạy khi đang phát */
  .eq { display: none; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { display: block; width: 3px; height: 100%; border-radius: 2px; background: var(--accent); transform-origin: bottom; transform: scaleY(.4); animation: eq .9s ease-in-out infinite; animation-play-state: paused; }
  .eq i:nth-child(2) { animation-delay: -.3s; }
  .eq i:nth-child(3) { animation-delay: -.6s; }
  .trk.active .eq, .row.active .eq { display: flex; }
  .trk.active .dur { display: none; }
  .row.active .ix b { display: none; }
  .is-playing .active .eq i { animation-play-state: running; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  /* ---------- Trang Music ---------- */
  .mv-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .mv-head h2 { font-weight: 400; font-size: 1.8rem; letter-spacing: .02em; }
  .mv-head small { display: block; color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .mv-actions { display: flex; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; cursor: pointer; font-size: .85rem; background: rgba(143,166,255,.18); border: 1px solid rgba(143,166,255,.5); transition: background .2s; }
  .btn:hover { background: rgba(143,166,255,.3); }
  .btn.ghost { background: none; border-color: var(--line); color: var(--muted); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .btn.ghost.on { color: var(--accent); border-color: rgba(143,166,255,.5); }
  .btn .icon { width: 16px; height: 16px; }
  .plist { display: flex; flex-direction: column; gap: 2px; padding: 10px; }

  .thanks { display: flex; align-items: center; justify-content: center; gap: 16px; color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .thanks i { display: block; width: 56px; height: 1px; background: var(--line); }

  /* Skills + Interests */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 7px 18px; border-radius: 999px; background: rgba(160,175,255,.1); border: 1px solid var(--line); font-size: .82rem; }
  .interests { display: flex; flex-direction: column; gap: 4px; }
  .interest { display: flex; align-items: center; gap: 14px; padding: 8px 0; font-size: .92rem; }
  .interest .icon { width: 22px; height: 22px; }
  .interest em { margin-left: auto; font-style: normal; color: var(--muted); font-size: .72rem; text-align: right; }

  /* ---------- Màn hình hố đen + chuyển cảnh ---------- */
  #intro { position: fixed; inset: 0; z-index: 100; background: #02030a; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: opacity .9s ease; }
  #intro:focus { outline: none; }
  #intro.leaving { opacity: 0; pointer-events: none; }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .intro-hint {
    position: absolute; left: 0; right: 0; bottom: 12vh; padding: 0 16px;
    text-align: center; font-size: .85rem; letter-spacing: .35em; text-transform: uppercase;
    color: var(--muted); pointer-events: none;
    animation: hint 2.6s ease-in-out infinite;
  }
  #intro.going .intro-hint { animation: none; opacity: 0; transition: opacity .35s; }
  @keyframes hint { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  html.intro-on, html.intro-on body { overflow: hidden; height: 100%; }
  html.intro-on .os { visibility: hidden; }
  .os.reveal { animation: enter 1.3s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes enter {
    from { opacity: 0; transform: scale(1.08); filter: blur(12px); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .desktop { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
    .icons { position: static; flex-direction: row; gap: 10px 6px; }
    .widgets { position: static; width: 100%; max-height: none; overflow: visible; }
    .win { position: fixed; inset: 0 0 60px 0 !important; width: auto !important; height: auto !important; border-radius: 0; border: 0; min-width: 0; min-height: 0; background: rgba(8, 11, 30, .97); }
    .win-bar { cursor: default; }
    .win-rs, .win-btns [data-act="max"] { display: none; }
    .win-body { padding: 18px 16px; }
    .taskbar { grid-template-columns: 1fr auto; padding: 0 6px; }
    .tb-left { display: none; }
    .tb-center { justify-self: start; overflow-x: auto; }
    .clock span { display: none; }
    .start { bottom: 66px; }
    .info-item { padding: 8px 16px 8px 0; border-left: 0; }
    .row { grid-template-columns: 26px 44px minmax(0, 1fr) auto; gap: 10px; padding: 8px; }
    .row .tc { width: 44px; height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .intro-hint { animation: none; opacity: .8; }
    .os.reveal, .win.pop, .start { animation-duration: .01s; }
    .eq i { animation: none !important; transform: scaleY(.7); }
    .eq i:nth-child(2) { transform: scaleY(1); }
    .eq i:nth-child(3) { transform: scaleY(.5); }
  }
</style>

const SOLID = new Set(["prev", "next", "play", "pause", "discord", "youtube", "github", "roblox", "dots", "spark"]);
const svg = (name, cls = "") =>
  `<svg class="icon ${SOLID.has(name) ? "solid " : ""}${cls}" viewBox="0 0 24 24">${ICONS[name] || ICONS.link}</svg>`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

/* ---------- Ảnh mặc định khi chưa có avatar / cover ---------- */
const placeholder = (a, b) => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/></svg>`
);
const DEFAULT_AVATAR = placeholder("#2a3a8f", "#0b1030");
const coverOf = (t, i) => t.cover || placeholder(`hsl(${(225 + i * 31) % 360} 55% 40%)`, `hsl(${(225 + i * 31) % 360} 50% 12%)`);

/* ---------- Ảnh nền: link trong CONFIG, nếu trống thì dùng ảnh nhúng sẵn ---------- */
const bgImageSrc = () => CONFIG.background.image || window.BG_IMAGE || "";
let bgPromise = null;
function loadBgImage() {
  if (!bgPromise) bgPromise = new Promise((resolve) => {
    const src = bgImageSrc();
    if (!src) { resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
  return bgPromise;
}

/* ---------- Dựng giao diện từ CONFIG ---------- */
function render() {
  const c = CONFIG;

  const bgSrc = bgImageSrc();
  if (bgSrc) {
    $("bg").style.backgroundImage = `url("${bgSrc}")`;
    $("bgOverlay").style.opacity = c.background.dim;
  }

  $("brandText").textContent = c.brand;
  $("topRight").textContent = c.topRight;
  $("name").textContent = c.name;
  $("tagline").textContent = c.tagline;
  $("avatar").src = c.avatar || DEFAULT_AVATAR;
  $("startAvatar").src = c.avatar || DEFAULT_AVATAR;
  $("footer").textContent = c.footer;
  document.title = c.name;

  $("socials").innerHTML = c.socials.map((s) =>
    `<a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.type}">${svg(s.type)}</a>`).join("");

  $("info").innerHTML = c.info.map((i) =>
    `<div class="info-item">${svg(i.icon)}<div><small>${i.label}</small><span>${i.value}</span></div></div>`).join("");

  $("quoteText").textContent = c.quote.text;
  $("quoteAuthor").textContent = "— " + c.quote.author;

  $("skills").innerHTML = c.skills.map((s) => `<span class="chip">${s}</span>`).join("");

  $("interests").innerHTML = c.interests.map((i) =>
    `<div class="interest">${svg(i.icon)}<span>${i.title}</span><em>${i.note}</em></div>`).join("");
  renderApps();
}

/* ---------- Hệ điều hành thu nhỏ: cửa sổ, icon, thanh tác vụ, menu Start ---------- */
const OS = {};
let player = null;
const isMobile = () => window.matchMedia("(max-width: 820px)").matches;

function renderApps() {
  const c = CONFIG;
  $("gallery").innerHTML = c.gallery.map((g, i) =>
    `<figure><img src="${g.src || placeholder(`hsl(${(225 + i * 37) % 360} 55% 42%)`, `hsl(${(235 + i * 37) % 360} 50% 12%)`)}" alt="${esc(g.caption || "")}"><figcaption>${esc(g.caption || "")}</figcaption></figure>`).join("");
  $("links").innerHTML = c.socials.map((s) => {

  }).join("");
}

function initOS() {
  const apps = CONFIG.apps;
  const desk = $("desktop");
  const byId = {};
  let z = 20, focusId = null;

  $("icons").innerHTML = apps.map((a) =>
    `<button class="dicon" data-app="${a.id}"><span class="tile">${svg(a.icon)}</span><span>${esc(a.label)}</span></button>`).join("");
  $("tbApps").innerHTML = apps.map((a) =>
    `<button class="tb-btn" data-app="${a.id}" title="${esc(a.label)}" aria-label="${esc(a.label)}">${svg(a.icon)}</button>`).join("");
  $("startApps").innerHTML = apps.map((a) =>
    `<button class="start-app" data-app="${a.id}"><span class="tile">${svg(a.icon)}</span><span>${esc(a.label)}</span></button>`).join("");
  $("startBtn").innerHTML = svg("spark");
  $("lockBtn").innerHTML = svg("lock");
  $("lockBtn2").innerHTML = svg("lock") + "Khoá màn hình";
  $("startNote").textContent = CONFIG.footer;

  apps.forEach((a) => {
    const el = document.querySelector(`.win[data-app="${a.id}"]`);
    if (!el) return;
    el.insertAdjacentHTML("afterbegin",
      `<header class="win-bar">${svg(a.icon)}<span class="win-title">${esc(a.label)}</span>
        <div class="win-btns">
          <button data-act="min" aria-label="Thu nhỏ" title="Thu nhỏ">${svg("minus")}</button>
          <button data-act="max" aria-label="Phóng to" title="Phóng to">${svg("square")}</button>
          <button data-act="close" class="x" aria-label="Đóng" title="Đóng">${svg("close")}</button>
        </div></header>`);
    el.insertAdjacentHTML("beforeend", '<i class="win-rs"></i>');
    el.hidden = true;
    byId[a.id] = { a, el, placed: false };
  });

  const deskSize = () => ({ w: desk.clientWidth, h: desk.clientHeight });

  function place(s) {
    const d = deskSize();
    const [w0, h0] = s.a.size || [640, 460];
    const w = Math.min(w0, d.w - 16), h = Math.min(h0, d.h - 16);
    const n = Object.values(byId).filter((x) => !x.el.hidden).length;
    const [px, py] = s.a.pos || [130 + n * 34, 30 + n * 28];
    s.el.style.width = w + "px";
    s.el.style.height = h + "px";
    s.el.style.left = Math.max(8, Math.min(px, d.w - w - 8)) + "px";
    s.el.style.top = Math.max(8, Math.min(py, d.h - h - 8)) + "px";
    s.placed = true;
  }

  function topWin() {
    let best = null, bz = -1;
    for (const id in byId) {
      const e = byId[id].el;
      if (!e.hidden && !e.classList.contains("min")) {
        const zi = +e.style.zIndex || 0;
        if (zi > bz) { bz = zi; best = id; }
      }
    }
    return best;
  }

  function sync() {
    for (const id in byId) {
      const e = byId[id].el;
      const open = !e.hidden;
      const focused = focusId === id && open && !e.classList.contains("min");
      e.classList.toggle("focused", focused);
      document.querySelectorAll(`.tb-btn[data-app="${id}"]`).forEach((b) => {
        b.classList.toggle("open", open);
        b.classList.toggle("active", focused);
      });
    }
  }

  function focus(id) {
    const s = byId[id];
    if (!s) return;
    if (++z > 2500) {                                   // đánh số lại để không vượt thanh tác vụ
      Object.values(byId).sort((p, q) => (+p.el.style.zIndex || 0) - (+q.el.style.zIndex || 0))
        .forEach((x, i) => { x.el.style.zIndex = 21 + i; });
      z = 21 + Object.keys(byId).length;
    }
    s.el.style.zIndex = z;
    focusId = id;
    sync();
  }

  function open(id) {
    const s = byId[id];
    if (!s) return;
    closeStart();
    if (s.el.hidden) {
      if (!s.placed) place(s);
      s.el.hidden = false;
      s.el.classList.remove("min");
      s.el.classList.add("pop");
      setTimeout(() => s.el.classList.remove("pop"), 260);
    } else {
      s.el.classList.remove("min");
    }
    focus(id);
  }
  function close(id) {
    const s = byId[id];
    s.el.hidden = true;
    s.el.classList.remove("min", "max");
    if (focusId === id) focusId = topWin();
    sync();
  }
  function minimize(id) {
    byId[id].el.classList.add("min");
    if (focusId === id) focusId = topWin();
    sync();
  }
  function toggleMax(id) {
    byId[id].el.classList.toggle("max");
    focus(id);
  }
  function taskClick(id) {
    const s = byId[id];
    if (s.el.hidden || s.el.classList.contains("min")) open(id);
    else if (focusId === id) minimize(id);
    else focus(id);
  }

  /* --- menu Start --- */
  function closeStart() {
    $("start").hidden = true;
    $("startBtn").setAttribute("aria-expanded", "false");
  }
  function toggleStart() {
    const show = $("start").hidden;
    $("start").hidden = !show;
    $("startBtn").setAttribute("aria-expanded", String(show));
  }

  /* --- kéo, đổi cỡ, lấy nét cửa sổ --- */
  desk.addEventListener("pointerdown", (e) => {
    const w = e.target.closest(".win");
    if (w) focus(w.dataset.app);
    else if (!e.target.closest(".dicon")) document.querySelectorAll(".dicon.sel").forEach((x) => x.classList.remove("sel"));
    if (!e.target.closest(".dicon")) closeStart();
    if (!w || isMobile()) return;

    const bar = e.target.closest(".win-bar");
    if (bar && !e.target.closest("button") && !w.classList.contains("max")) {
      const sx = e.clientX, sy = e.clientY, ox = w.offsetLeft, oy = w.offsetTop;
      bar.setPointerCapture(e.pointerId);
      bar.classList.add("drag");
      const mv = (ev) => {
        const d = deskSize();
        w.style.left = Math.min(Math.max(ox + ev.clientX - sx, 90 - w.offsetWidth), d.w - 90) + "px";
        w.style.top = Math.min(Math.max(oy + ev.clientY - sy, 0), d.h - 42) + "px";
      };
      const up = () => {
        bar.removeEventListener("pointermove", mv);
        bar.removeEventListener("pointerup", up);
        bar.removeEventListener("pointercancel", up);
        bar.classList.remove("drag");
      };
      bar.addEventListener("pointermove", mv);
      bar.addEventListener("pointerup", up);
      bar.addEventListener("pointercancel", up);
      return;
    }

    const rs = e.target.closest(".win-rs");
    if (rs) {
      const sx = e.clientX, sy = e.clientY, ow = w.offsetWidth, oh = w.offsetHeight, L = w.offsetLeft, T = w.offsetTop;
      rs.setPointerCapture(e.pointerId);
      const mv = (ev) => {
        const d = deskSize();
        w.style.width = Math.max(320, Math.min(ow + ev.clientX - sx, d.w - L)) + "px";
        w.style.height = Math.max(220, Math.min(oh + ev.clientY - sy, d.h - T)) + "px";
      };
      const up = () => {
        rs.removeEventListener("pointermove", mv);
        rs.removeEventListener("pointerup", up);
        rs.removeEventListener("pointercancel", up);
      };
      rs.addEventListener("pointermove", mv);
      rs.addEventListener("pointerup", up);
      rs.addEventListener("pointercancel", up);
    }
  });

  desk.addEventListener("click", (e) => {
    const b = e.target.closest(".win-btns button");
    if (!b) return;
    const id = b.closest(".win").dataset.app;
    if (b.dataset.act === "min") minimize(id);
    else if (b.dataset.act === "max") toggleMax(id);
    else close(id);
  });
  desk.addEventListener("dblclick", (e) => {
    const bar = e.target.closest(".win-bar");
    if (bar && !e.target.closest("button") && !isMobile()) toggleMax(bar.parentElement.dataset.app);
  });

  /* --- icon màn hình nền: bấm đúp để mở (cảm ứng thì bấm một lần) --- */
  $("icons").addEventListener("click", (e) => {
    const b = e.target.closest(".dicon");
    if (!b) return;
    document.querySelectorAll(".dicon").forEach((x) => x.classList.toggle("sel", x === b));
    if (window.matchMedia("(hover: none)").matches) open(b.dataset.app);
  });
  $("icons").addEventListener("dblclick", (e) => {
    const b = e.target.closest(".dicon");
    if (b) open(b.dataset.app);
  });
  $("icons").addEventListener("keydown", (e) => {
    const b = e.target.closest(".dicon");
    if (b && e.key === "Enter") { e.preventDefault(); open(b.dataset.app); }
  });

  /* --- thanh tác vụ và menu Start --- */
  $("taskbar").addEventListener("click", (e) => {
    const b = e.target.closest(".tb-btn[data-app]");
    if (b) taskClick(b.dataset.app);
  });
  $("startBtn").onclick = toggleStart;
  $("startApps").addEventListener("click", (e) => {
    const b = e.target.closest(".start-app");
    if (b) open(b.dataset.app);
  });
  $("tbSongBtn").onclick = () => open("music");
  $("viewAll").onclick = () => open("music");
  $("lockBtn").onclick = lockScreen;
  $("lockBtn2").onclick = lockScreen;
  document.addEventListener("pointerdown", (e) => {
    if (!$("start").hidden && !e.target.closest("#start, #startBtn")) closeStart();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeStart(); });

  /* --- đồng hồ --- */
  function tick() {
    const d = new Date();
    $("clockTime").textContent = d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    $("clockDate").textContent = d.toLocaleDateString("vi-VN");
  }
  tick();
  setInterval(tick, 1000);

  OS.open = open;
  OS.closeStart = closeStart;

  // cửa sổ mở sẵn khi vào, hoặc mở theo #tên-ứng-dụng trên đường dẫn
  const fromHash = location.hash.slice(1);
  apps.filter((a) => a.open || a.id === fromHash).forEach((a) => open(a.id));
}

/* ---------- Khoá màn hình: quay lại hố đen ---------- */
function lockScreen() {
  if ($("intro")) return;
  if (OS.closeStart) OS.closeStart();
  const el = document.createElement("div");
  el.id = "intro";
  el.setAttribute("role", "button");
  el.tabIndex = 0;
  el.setAttribute("aria-label", "Chạm để mở khoá");
  el.innerHTML = '<canvas id="introCanvas"></canvas><p class="intro-hint" id="introHint"></p>';
  document.body.appendChild(el);
  initIntro(player, { enabled: true, startMusic: false, text: CONFIG.intro.lockText || "Chạm để mở khoá" });
}

/* ---------- Discord qua Lanyard API ---------- */
async function loadDiscord() {
  const d = CONFIG.discord;
  if (!d.enabled || !d.userId) return;
  try {
    const res = await fetch(`https://api.lanyard.rest/v1/users/${d.userId}`);
    const json = await res.json();
    if (!json.success) throw new Error("Lanyard không tìm thấy user");
    const u = json.data.discord_user;

    if (d.useName) {
      const n = d.nameType === "username" ? u.username : (u.global_name || u.username);
      $("name").textContent = n;
      $("brandText").textContent = n;
      document.title = n;
    }
    if (d.useAvatar && u.avatar) {
      const ext = u.avatar.startsWith("a_") ? "gif" : "png";
      const url = `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${ext}?size=256`;
      $("avatar").src = url;
      $("startAvatar").src = url;
    }
  } catch (err) {
    console.warn("Discord API lỗi, dùng thông tin trong CONFIG:", err);
  }
}

/* ---------- Trình phát nhạc ---------- */
function initPlayer() {
  const M = CONFIG.music;
  const list = M.playlist;
  const audio = new Audio();
  audio.preload = "metadata";

  let idx = 0, playing = false, shuffle = false, repeat = 0; // repeat: 0 tắt, 1 cả list, 2 một bài
  let fake = 0, timer = null, muted = false;
  const liked = new Set();

  let volume = M.volume;
  try { const s = parseFloat(localStorage.getItem("bio-volume")); if (s >= 0 && s <= 1) volume = s; } catch (e) {}

  const cur = () => list[idx];
  const isReal = () => !!cur().src;
  const total = () => (isReal() && isFinite(audio.duration) ? audio.duration : cur().duration || 0);
  const now = () => (isReal() ? audio.currentTime : fake);

  /* --- vẽ lại giao diện --- */
  function paint() {
    const t = total(), n = now(), p = t ? Math.min(n / t, 1) : 0;
    $("seek").value = Math.round(p * 1000);
    $("seek").style.setProperty("--p", p * 100 + "%");
    $("tNow").textContent = fmt(n);
    $("tTotal").textContent = fmt(t);
  }
  function renderNow() {
    const t = cur();
    $("cover").src = coverOf(t, idx);
    $("songTitle").textContent = t.title;
    $("songArtist").textContent = t.artist;
    $("tbSong").textContent = `${t.title} · ${t.artist}`;
    $("nowLabel").textContent = M.label;
    $("heart").classList.toggle("on", liked.has(idx));
  }
  const eq = '<span class="eq"><i></i><i></i><i></i></span>';
  function renderLists() {
    $("miniList").innerHTML = list.map((t, i) =>
      `<button class="trk${i === idx ? " active" : ""}" data-i="${i}" aria-label="Phát ${esc(t.title)}">
        <img class="tc" src="${coverOf(t, i)}" alt="">
        <span class="tt"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></span>
        <span><span class="dur">${fmt(t.duration || 0)}</span>${eq}</span>
      </button>`).join("");
    $("fullList").innerHTML = list.map((t, i) =>
      `<button class="row${i === idx ? " active" : ""}" data-i="${i}" aria-label="Phát ${esc(t.title)}">
        <span class="ix"><b>${i + 1}</b>${eq}</span>
        <img class="tc" src="${coverOf(t, i)}" alt="">
        <span class="tt"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></span>
        <span class="dur">${fmt(t.duration || 0)}</span>
      </button>`).join("");
    $("plCount").textContent = `${list.length} bài hát`;
    centerActive();
  }
  function centerActive() {
    const m = $("miniList"), a = m.querySelector(".active");
    if (a) m.scrollTop = a.offsetTop - m.clientHeight / 2 + a.clientHeight / 2;
  }
  function renderControls() {
    $("play").innerHTML = svg(playing ? "pause" : "play");
    document.body.classList.toggle("is-playing", playing);
    $("shuffle").classList.toggle("on", shuffle);
    $("shuffleAll").classList.toggle("on", shuffle);
    $("repeat").classList.toggle("on", repeat > 0);
    $("repeat").dataset.mode = ["off", "all", "one"][repeat];
    $("repeat").title = ["Lặp lại: tắt", "Lặp lại cả danh sách", "Lặp lại một bài"][repeat];
  }
  function renderVolume() {
    const v = muted ? 0 : volume;
    audio.volume = v;
    $("vol").value = Math.round(v * 100);
    $("vol").style.setProperty("--p", v * 100 + "%");
    $("volNum").textContent = Math.round(v * 100);
    $("mute").innerHTML = svg(v === 0 ? "volMute" : v < 0.5 ? "volLow" : "volHigh");
  }

  /* --- phát / dừng --- */
  function stopFake() { clearInterval(timer); timer = null; }
  function setPlaying(v) {
    playing = v;
    stopFake();
    if (v) {
      if (isReal()) {
        audio.play().catch(() => { playing = false; renderControls(); });
      } else {
        timer = setInterval(() => {
          fake = Math.min(fake + 0.25, cur().duration);
          paint();
          if (fake >= cur().duration) next(true);
        }, 250);
      }
    } else {
      audio.pause();
    }
    renderControls();
  }

  function loadTrack(i, autoplay) {
    idx = i;
    stopFake();
    audio.pause();
    fake = 0;
    if (isReal()) audio.src = cur().src; else audio.removeAttribute("src");
    renderNow();
    renderLists();
    paint();
    setPlaying(!!autoplay);
  }

  function next(fromEnd) {
    if (fromEnd && repeat === 2) { loadTrack(idx, true); return; }
    let n;
    if (shuffle && list.length > 1) {
      do { n = Math.floor(Math.random() * list.length); } while (n === idx);
    } else {
      n = idx + 1;
      if (n >= list.length) {
        if (fromEnd && repeat === 0) { loadTrack(0, false); return; }
        n = 0;
      }
    }
    loadTrack(n, true);
  }
  function prev() {
    if (now() > 3) { if (isReal()) audio.currentTime = 0; else fake = 0; paint(); return; }
    loadTrack((idx - 1 + list.length) % list.length, true);
  }
  function select(i) { if (i === idx) setPlaying(!playing); else loadTrack(i, true); }

  /* --- sự kiện --- */
  audio.addEventListener("timeupdate", paint);
  audio.addEventListener("loadedmetadata", () => {
    if (isFinite(audio.duration)) { cur().duration = Math.round(audio.duration); renderLists(); }
    paint();
  });
  audio.addEventListener("ended", () => next(true));
  audio.addEventListener("error", () => { if (isReal() && playing) { playing = false; renderControls(); } });

  $("play").onclick = () => setPlaying(!playing);
  $("prev").onclick = prev;
  $("next").onclick = () => next(false);
  $("shuffle").onclick = () => { shuffle = !shuffle; renderControls(); };
  $("shuffleAll").onclick = () => { shuffle = true; loadTrack(Math.floor(Math.random() * list.length), true); };
  $("playAll").onclick = () => loadTrack(0, true);
  $("repeat").onclick = () => { repeat = (repeat + 1) % 3; renderControls(); };
  $("heart").onclick = () => { liked.has(idx) ? liked.delete(idx) : liked.add(idx); $("heart").classList.toggle("on", liked.has(idx)); };

  $("seek").oninput = (e) => {
    const t = (e.target.value / 1000) * total();
    if (isReal()) audio.currentTime = t; else fake = t;
    paint();
  };
  $("vol").oninput = (e) => {
    volume = e.target.value / 100;
    muted = volume === 0;
    try { localStorage.setItem("bio-volume", String(volume)); } catch (err) {}
    renderVolume();
  };
  // Máy tính: rê chuột vào là hiện thanh, bấm nút để tắt/bật tiếng.
  // Điện thoại (không có hover): bấm nút để mở/đóng thanh, kéo về 0 để tắt tiếng.
  const noHover = window.matchMedia("(hover: none)");
  $("mute").onclick = () => {
    if (noHover.matches) { $("volWrap").classList.toggle("open"); return; }
    if (muted && volume === 0) volume = 0.5;
    muted = !muted;
    renderVolume();
  };
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#volWrap")) $("volWrap").classList.remove("open");
  });
  $("miniList").onclick = $("fullList").onclick = (e) => {
    const b = e.target.closest("[data-i]");
    if (b) select(+b.dataset.i);
  };

  /* --- mở / tắt danh sách phát (nút 3 chấm) --- */
  let miniOpen = M.miniOpen !== false;
  function renderMini() {
    $("miniWrap").classList.toggle("closed", !miniOpen);
    $("miniToggle").setAttribute("aria-expanded", String(miniOpen));
  }
  $("miniToggle").onclick = () => {
    miniOpen = !miniOpen;
    renderMini();
    if (miniOpen) setTimeout(centerActive, 280);
  };

  /* --- khởi tạo --- */
  $("miniToggle").innerHTML = svg("dots");
  renderMini();
  $("heart").innerHTML = svg("heart");
  $("shuffle").innerHTML = svg("shuffle");
  $("repeat").innerHTML = svg("repeat");
  $("prev").innerHTML = svg("prev");
  $("next").innerHTML = svg("next");
  $("miniTitle").innerHTML = svg("list") + esc(M.miniTitle);
  $("playAll").innerHTML = svg("play") + "Phát tất cả";
  $("shuffleAll").innerHTML = svg("shuffle") + "Ngẫu nhiên";
  if (isReal()) audio.src = cur().src;
  renderNow();
  renderLists();
  renderControls();
  renderVolume();
  paint();

  return { play: () => { if (!playing) setPlaying(true); } };
}

/* ---------- Màn hình mở đầu: cục vật chất tối bẻ cong ánh sáng, chạm vào là bị hút vào trang bio ---------- */
// Một khối vật chất tối vô hình bay vòng tròn trước một thiên hà mô phỏng. Nó không phát sáng,
// chỉ bẻ cong ánh sáng của sao và thiên hà phía sau (thấu kính hấp dẫn của khối điểm).
// Nếu thiết bị không hỗ trợ WebGL thì tự chuyển sang bản vẽ 2D đơn giản.
const LENS_FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uLens;      // vị trí vật chất tối (đơn vị: chiều cao màn hình)
uniform float uThetaE;   // bán kính Einstein: độ mạnh của việc bẻ cong
uniform float uCore;     // lõi tối ở giữa
uniform float uSwirl;    // độ xoáy khi bị hút vào
uniform float uFade;     // 1 = bình thường, 0 = đen hẳn
uniform sampler2D uTex;  // ảnh nền (Dải Ngân Hà)
uniform vec2 uImg;       // kích thước ảnh trong hệ toạ độ của shader (đã phủ kín màn hình)
uniform float uHasTex;   // 1 nếu có ảnh, 0 thì dùng thiên hà vẽ bằng code

float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float hash31(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }

float vnoise(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash31(i);
  float b = hash31(i + vec3(1.0, 0.0, 0.0));
  float c = hash31(i + vec3(0.0, 1.0, 0.0));
  float d = hash31(i + vec3(1.0, 1.0, 0.0));
  float e = hash31(i + vec3(0.0, 0.0, 1.0));
  float g = hash31(i + vec3(1.0, 0.0, 1.0));
  float h = hash31(i + vec3(0.0, 1.0, 1.0));
  float k = hash31(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
             mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);
}

float fbm(vec3 p) {
  float s = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    s += a * vnoise(p);
    p = p * 2.03 + vec3(7.1, 3.7, 1.3);
    a *= 0.5;
  }
  return s;
}

vec3 starLayer(vec2 q, float sc, float thr) {
  vec2 p = q * sc;
  vec2 i = floor(p);
  vec2 f = fract(p);
  float h = hash21(i);
  if (h < thr) return vec3(0.0);
  vec2 c = 0.2 + 0.6 * vec2(hash21(i + 7.3), hash21(i + 13.1));
  float d = length(f - c);
  float size = 0.07 + 0.12 * hash21(i + 3.7);
  float br = 0.4 + 1.8 * pow(hash21(i + 9.2), 3.0);
  float tw = 0.85 + 0.15 * sin(uTime * 1.4 + h * 60.0);
  vec3 tint = mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.85, 0.7), hash21(i + 21.0));
  return tint * smoothstep(size, 0.0, d) * br * tw;
}

vec3 galaxy(vec2 q) {
  vec2 c = q - vec2(0.14, 0.03);
  c = mat2(0.9, -0.43, 0.43, 0.9) * c;
  c.y /= 0.52;
  float r = length(c);
  float a = atan(c.y, c.x);
  float n = fbm(vec3(c * 5.0, 2.0));
  float ph = a * 2.0 - log(r + 0.03) * 5.2 + n * 1.6;
  float arm = pow(0.5 + 0.5 * cos(ph), 2.2);
  float disk = exp(-r * 3.2);
  float bulge = exp(-r * r * 90.0) * 1.8 + exp(-r * 12.0) * 0.5;
  float dust = smoothstep(0.35, 0.8, fbm(vec3(c * 9.0 + 4.0, 7.0))) * arm * disk * 0.8;
  float dens = disk * (0.18 + 0.9 * arm) * (0.6 + 0.8 * n);
  float hii = smoothstep(0.55, 0.85, vnoise(vec3(c * 22.0, 3.0)));
  vec3 armCol = mix(vec3(0.50, 0.62, 1.0), vec3(1.0, 0.50, 0.68), hii * 0.6);
  vec3 col = armCol * dens * 1.3;
  col += vec3(1.0, 0.78, 0.5) * bulge;
  col *= 1.0 - dust;
  col *= smoothstep(0.8, 0.35, r);
  float sp = hash21(floor(c * 260.0));
  col += vec3(1.0, 0.95, 0.9) * step(0.992, sp) * dens * 1.6;
  return col;
}

vec3 background(vec2 q) {
  vec3 col = vec3(0.004, 0.006, 0.02);
  col += vec3(0.02, 0.03, 0.09) * pow(fbm(vec3(q * 1.4 + 11.0, 5.0)), 2.0);
  col += galaxy(q);
  col += starLayer(q, 42.0, 0.88);
  col += starLayer(q, 95.0, 0.93) * 0.9;
  col += starLayer(q, 200.0, 0.96) * 0.8;
  return col;
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  float s = min(uRes.y, uRes.x * 1.15);
  vec2 uv = (fc - 0.5 * uRes) / s;

  // thấu kính hấp dẫn: điểm ảnh θ lấy ánh sáng từ vị trí β = θ - θE² θ / |θ|²
  vec2 th = uv - uLens;
  float t2 = dot(th, th) + 1e-6;
  float tl = sqrt(t2);
  float ang = uSwirl / (tl + 0.12);
  float cs = cos(ang);
  float sn = sin(ang);
  vec2 ths = vec2(cs * th.x - sn * th.y, sn * th.x + cs * th.y);
  vec2 src = uLens + ths - uThetaE * uThetaE * ths / t2;

  vec3 col;
  float tonemap = 1.0;
  if (uHasTex > 0.5) {
    vec2 tc = src / uImg + 0.5;
    tc = abs(mod(tc + 1.0, 2.0) - 1.0);   // lặp đối xứng khi ánh sáng bị bẻ ra ngoài ảnh
    col = texture2D(uTex, tc).rgb * 1.12;
    tonemap = 0.0;
  } else {
    col = background(src);
  }

  // lõi tối nhỏ ở giữa khối vật chất tối
  float shade = 1.0 - smoothstep(uCore * 0.5, uCore * 2.2, tl);
  col *= 1.0 - shade * mix(0.3, 1.0, smoothstep(0.0, 0.5, uThetaE));

  if (tonemap > 0.5) col = 1.0 - exp(-col * 1.35);
  float vg = smoothstep(1.25, 0.2, length((fc - 0.5 * uRes) / uRes.y));
  col *= mix(0.55, 1.0, vg);
  col *= uFade;
  col += (hash21(fc + uTime) - 0.5) / 170.0 * uFade;
  gl_FragColor = vec4(col, 1.0);
}
`;

function createGLView(img) {
  const cv = $("introCanvas");
  let gl = null;
  try { gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" }); } catch (e) {}
  if (!gl) return null;

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(sh)); return null; }
    return sh;
  };
  const vs = compile(gl.VERTEX_SHADER, "attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }");
  const fs = compile(gl.FRAGMENT_SHADER, LENS_FRAG);
  if (!vs || !fs) return null;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(prog)); return null; }
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ["uRes", "uTime", "uLens", "uThetaE", "uCore", "uSwirl", "uFade", "uTex", "uImg", "uHasTex"].forEach((n) => { U[n] = gl.getUniformLocation(prog, n); });

  // đưa ảnh nền lên GPU (thu nhỏ nếu vượt giới hạn texture của máy)
  let hasTex = 0, imgAspect = 1;
  if (img) {
    try {
      const maxT = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      const k = Math.min(1, maxT / Math.max(img.naturalWidth, img.naturalHeight));
      let source = img;
      if (k < 1) {
        source = document.createElement("canvas");
        source.width = Math.round(img.naturalWidth * k);
        source.height = Math.round(img.naturalHeight * k);
        source.getContext("2d").drawImage(img, 0, 0, source.width, source.height);
      }
      const tex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, source);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      hasTex = gl.getError() === gl.NO_ERROR ? 1 : 0;
      imgAspect = img.naturalWidth / img.naturalHeight;
    } catch (err) { hasTex = 0; }
  }

  return {
    resize(W, H) {
      const k = Math.min(1, Math.sqrt(1.2e6 / (W * H)));   // giữ số điểm ảnh vừa phải cho máy yếu
      cv.width = Math.max(2, Math.round(W * k));
      cv.height = Math.max(2, Math.round(H * k));
      gl.viewport(0, 0, cv.width, cv.height);
      // ảnh phủ kín màn hình (cover), chừa thêm 8% để khối tối bay ra mép vẫn có ảnh
      const s = Math.min(cv.height, cv.width * 1.15);
      const hq = Math.max(cv.height / s, cv.width / s / imgAspect) * 1.08;
      gl.uniform2f(U.uImg, hq * imgAspect, hq);
      gl.uniform1f(U.uHasTex, hasTex);
      gl.uniform1i(U.uTex, 0);
    },
    // clock: giây (tăng nhanh dần khi lao vào), e: 0 là đang chờ, 1 là đã bị hút hết
    draw(clock, dt, e) {
      const R = 0.27;                                   // bán kính quỹ đạo vòng tròn
      const a = clock * 0.42;
      const px = R * Math.cos(a), py = 0.03 + R * Math.sin(a);
      const pull = Math.min(1, e / 0.7);
      const k = pull * pull * (3 - 2 * pull);
      const lx = px * (1 - k), ly = py * (1 - k) + 0.0 * k;
      gl.uniform2f(U.uRes, cv.width, cv.height);
      gl.uniform1f(U.uTime, clock);
      gl.uniform2f(U.uLens, lx, ly);
      gl.uniform1f(U.uThetaE, 0.07 + 0.92 * e * e);
      gl.uniform1f(U.uCore, 0.006 + 1.25 * e * e * e);
      gl.uniform1f(U.uSwirl, 6.0 * e * e);
      gl.uniform1f(U.uFade, 1.0 - Math.min(1, Math.max(0, (e - 0.9) / 0.1)));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
    destroy() { const x = gl.getExtension("WEBGL_lose_context"); if (x) x.loseContext(); }
  };
}

// Bản dự phòng 2D (khi không có WebGL): thiên hà mờ + khối tối bay vòng tròn
function create2DView(img) {
  const old = $("introCanvas");
  const cv = document.createElement("canvas");
  cv.id = "introCanvas";
  old.replaceWith(cv);
  const ctx = cv.getContext("2d");
  let W, H, S;

  const stars = Array.from({ length: 260 }, () => ({
    x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 1.2, ph: Math.random() * 6.28
  }));

  return {
    resize(w, h) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = w; H = h; S = Math.min(h, w * 1.15);
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },
    draw(clock, dt, e) {
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#02030a";
      ctx.fillRect(0, 0, W, H);

      // ảnh nền (cover) hoặc thiên hà vẽ tay nếu chưa có ảnh
      if (img) {
        const k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
        const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
        ctx.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
      }
      ctx.save();
      if (img) ctx.globalAlpha = 0;
      ctx.translate(W / 2 + 0.14 * S, H / 2 - 0.03 * S);
      ctx.rotate(-0.45);
      ctx.scale(1, 0.52);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, S * 0.7);
      g.addColorStop(0, "rgba(255, 215, 160, .9)");
      g.addColorStop(0.12, "rgba(200, 190, 255, .45)");
      g.addColorStop(0.5, "rgba(90, 120, 255, .16)");
      g.addColorStop(1, "rgba(60, 80, 220, 0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, S * 0.7, 0, 6.283); ctx.fill();
      ctx.restore();

      // sao
      if (!img) for (const st of stars) {
        const tw = 0.5 + 0.5 * Math.sin(clock * 1.4 + st.ph);
        ctx.fillStyle = `rgba(220, 230, 255, ${(0.35 + 0.5 * tw) * (1 - e)})`;
        ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.s, 0, 6.283); ctx.fill();
      }

      // khối vật chất tối bay vòng tròn
      const a = clock * 0.42, R = 0.27;
      const k = Math.min(1, e / 0.7);
      const lx = W / 2 + R * Math.cos(a) * S * (1 - k * k);
      const ly = H / 2 - (0.03 + R * Math.sin(a)) * S * (1 - k * k);
      const rad = S * (0.05 + 1.6 * e * e * e);
      const d = ctx.createRadialGradient(lx, ly, 0, lx, ly, rad * 2.2);
      d.addColorStop(0, "rgba(0, 0, 0, 1)");
      d.addColorStop(0.45, "rgba(0, 0, 0, .9)");
      d.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = d;
      ctx.beginPath(); ctx.arc(lx, ly, rad * 2.2, 0, 6.283); ctx.fill();
    },
    destroy() {}
  };
}

function initIntro(player, opts) {
  const cfg = Object.assign({}, CONFIG.intro, opts || {});
  const el = $("intro");
  if (!cfg.enabled) { el.remove(); return; }

  const root = document.documentElement;
  root.classList.add("intro-on");
  document.querySelector(".os").classList.remove("reveal");
  $("introHint").textContent = cfg.text || "";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = 2900;       // thời gian bị hút vào khối vật chất tối (ms)

  loadBgImage().then((img) => startIntro(img));

  function startIntro(img) {
  const view = createGLView(img) || create2DView(img);
  const onResize = () => view.resize(window.innerWidth, window.innerHeight);
  onResize();
  window.addEventListener("resize", onResize);

  let going = false, finished = false, t0 = 0, last = performance.now(), clock = 0;

  function frame(t) {
    if (finished) return;
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    const p = going ? Math.min((t - t0) / DUR, 1) : 0;
    const e = Math.pow(p, 1.3);
    clock += dt * (1 + 10 * e);
    view.draw(clock, dt, e, going);
    if (p >= 1) { finish(); return; }
    requestAnimationFrame(frame);
  }

  function finish() {
    finished = true;
    window.removeEventListener("resize", onResize);
    root.classList.remove("intro-on");
    document.querySelector(".os").classList.add("reveal");
    el.classList.add("leaving");
    setTimeout(() => { view.destroy(); el.remove(); }, 1100);
  }

  function enter() {
    if (going) return;
    going = true;
    t0 = performance.now();
    el.classList.add("going");
    if (cfg.startMusic && player) player.play();   // phải gọi ngay lúc chạm để trình duyệt cho phép phát nhạc
    if (reduce) finish();
  }

  el.addEventListener("click", enter);
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); }
  });
  el.focus({ preventScroll: true });

  if (reduce) view.draw(0, 0, 0, false); else requestAnimationFrame(frame);
  }
}

// chạy sau khi cả trang (kể cả ảnh nền nhúng ở cuối file) đã đọc xong
window.addEventListener("DOMContentLoaded", () => {
  render();
  player = initPlayer();
  initOS();
  initIntro(player);
  loadDiscord();
});
</script>
